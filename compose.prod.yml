services:
  app:      { restart: unless-stopped, healthcheck: { test: ["CMD-SHELL", "php-fpm -t || exit 1"] } }
  queue:    { restart: unless-stopped }
  scheduler: { restart: unless-stopped }
  reverb:   { restart: unless-stopped }
  nginx:
    restart: unless-stopped
    build: { context: ., dockerfile: docker/php/Dockerfile, target: web }
    ports: ["127.0.0.1:${HTTP_PORT}:80"] # só o Caddy do anfitrião (TLS) chega aqui
  postgres: { restart: unless-stopped }
  redis:    { restart: unless-stopped }
