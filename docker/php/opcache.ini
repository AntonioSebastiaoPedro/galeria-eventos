; Sem OPcache o PHP volta a compilar o Laravel inteiro em cada pedido (cada miniatura da galeria é um pedido).
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Em produção o código vem dentro da imagem e só muda com um novo deploy (que recria o contentor): não é preciso
; verificar se os ficheiros mudaram. Em desenvolvimento o código está montado e muda a toda a hora.
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE:-1}
opcache.revalidate_freq = 0
