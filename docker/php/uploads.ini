; Fotografias e vídeos dos convidados: os limites reais (por tipo e por plano) são aplicados pela aplicação
; (config/media.php). Estes valores só têm de ser maiores do que eles; sem isto o PHP recusa tudo acima de 2 MB.
upload_max_filesize = 310M
post_max_size = 320M
max_file_uploads = 20
; As fotografias de telemóvel (48 MP) descomprimidas no GD ocupam centenas de MB ao gerar as miniaturas.
memory_limit = 768M
