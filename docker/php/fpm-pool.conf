; Processos PHP em paralelo. O padrão da imagem é 5: com uma galeria aberta por várias pessoas, os pedidos
; ficavam em fila. Cada processo ocupa ~40-80 MB num pedido normal (mais ao gerar miniaturas, mas isso é na fila).
[www]
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000
