# Incluído no server {} e nas locations que definem add_header próprio (o nginx não os herda).
# A CSP limita-se ao que não depende do código da interface: impede que a aplicação seja embutida noutro site
# (clickjacking), plugins e a alteração do <base>. Uma CSP completa (script-src/connect-src) deve ser testada
# primeiro com Content-Security-Policy-Report-Only, por causa do Service Worker, do WebSocket e dos vídeos.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=()" always;
