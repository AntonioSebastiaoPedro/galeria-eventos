# Produção: serve a interface (PWA), encaminha a API para o PHP-FPM e o WebSocket para o Reverb.
# O TLS (HTTPS) é obrigatório: a câmara e o Service Worker só funcionam em contexto seguro.
# Termine-o aqui (listen 443 ssl + certificados) ou num proxy à frente deste contentor.
server {
    listen 80;
    root /var/www/spa;
    index index.html;
    client_max_body_size 320m;
    # Vídeos grandes em redes móveis lentas: dá tempo ao envio e ao PHP.
    client_body_timeout 300s;
    fastcgi_read_timeout 300s;

    # Resolve os nomes a cada pedido (DNS do Docker): quando um contentor é recriado, o nginx não fica a apontar para o endereço antigo.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Cabeçalhos de segurança (always: também nas respostas de erro). As locations com add_header próprio
    # não herdam estes, por isso repetem-nos através do include.
    include /etc/nginx/snippets/security-headers.conf;

    location /app/ { # WebSocket (Reverb)
        set $reverb reverb:8080;
        proxy_pass http://$reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    location ~ ^/(api|sanctum|broadcasting|telescope|up)(/|$) {
        set $php app:9000;
        fastcgi_pass $php;
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    }

    # O Service Worker e o manifesto nunca ficam em cache, para as atualizações chegarem.
    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        default_type application/manifest+json; # só se aplica ao .webmanifest; os .js mantêm o tipo normal
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Ficheiros com hash no nome podem ficar em cache para sempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location / { try_files $uri /index.html; }
}
