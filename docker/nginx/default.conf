server {
    listen 80;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 320m;
    # Vídeos grandes em redes móveis lentas: dá tempo ao envio e ao PHP.
    client_body_timeout 300s;
    fastcgi_read_timeout 300s;

    # Resolve os nomes a cada pedido (DNS do Docker): quando um contentor é recriado, o nginx não fica a apontar para o endereço antigo.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /app { # WebSocket (Reverb)
        set $reverb reverb:8080;
        proxy_pass http://$reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        set $php app:9000;
        fastcgi_pass $php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
