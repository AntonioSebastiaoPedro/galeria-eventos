services:
  app:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment: { COMPOSER_HOME: /tmp/composer }
    volumes: [./backend:/var/www/html]
  queue:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment: { COMPOSER_HOME: /tmp/composer }
    volumes: [./backend:/var/www/html]
  scheduler:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment: { COMPOSER_HOME: /tmp/composer }
    volumes: [./backend:/var/www/html]
  reverb:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment: { COMPOSER_HOME: /tmp/composer }
    volumes: [./backend:/var/www/html]
    ports: ["127.0.0.1:${REVERB_HOST_PORT}:8080"]
  nginx:
    ports: ["127.0.0.1:${HTTP_PORT}:80", "127.0.0.1:${HTTPS_PORT}:443"]
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/html:ro
  postgres:
    ports: ["127.0.0.1:${DB_HOST_PORT}:5432"]
  redis:
    ports: ["127.0.0.1:${REDIS_HOST_PORT}:6379"]
  node:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes: [./frontend:/app]
    ports: ["${VITE_HOST_PORT}:5173"]
  mailpit:
    image: axllent/mailpit
    ports: ["127.0.0.1:${MAILPIT_SMTP_PORT}:1025", "127.0.0.1:${MAILPIT_UI_PORT}:8025"]
